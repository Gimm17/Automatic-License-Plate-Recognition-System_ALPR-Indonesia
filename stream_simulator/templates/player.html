<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ stream.name }} - Stream Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.player-wrap{width:100%;max-width:960px}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;object-fit:contain}
.info{margin-top:16px;text-align:center}
.info h2{font-size:18px;margin-bottom:4px}
.info p{font-size:13px;color:#9ca3af}
.url-box{margin-top:12px;background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:10px 14px;font-family:monospace;font-size:12px;color:#60a5fa;word-break:break-all;cursor:pointer;text-align:center}
.url-box:hover{background:#1e293b}
.status{margin-top:8px;font-size:12px;color:#6b7280}
.status.live{color:#22c55e}
.status.error{color:#ef4444}
.back{margin-top:20px;color:#9ca3af;font-size:13px;text-decoration:none}
.back:hover{color:#fff}
</style>
</head>
<body>
<div class="player-wrap">
  <video id="video" muted autoplay playsinline controls></video>
  <div class="info">
    <h2>{{ stream.name }}</h2>
    <p id="statusText" class="status">Connecting...</p>
    <div class="url-box" onclick="navigator.clipboard.writeText('{{ hls_url }}');document.getElementById('statusText').textContent='URL copied!'">
      {{ hls_url }}
    </div>
  </div>
  <a href="/" class="back">&larr; Kembali ke Dashboard</a>
</div>
<script>
var video = document.getElementById('video');
var statusEl = document.getElementById('statusText');
var url = '{{ hls_url }}';
var retryCount = 0;
var maxRetries = 30;

function startPlayer() {
  if (Hls.isSupported()) {
    var hls = new Hls({
      liveSyncDuration: 3,
      liveMaxLatencyDuration: 10,
      manifestLoadingTimeOut: 10000,
      manifestLoadingMaxRetry: 10,
      manifestLoadingRetryDelay: 2000,
      levelLoadingTimeOut: 10000,
      levelLoadingMaxRetry: 10,
      fragLoadingTimeOut: 10000,
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      statusEl.textContent = 'LIVE';
      statusEl.className = 'status live';
      video.play().catch(function(){});
      retryCount = 0;
    });
    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        retryCount++;
        if (retryCount <= maxRetries) {
          statusEl.textContent = 'Waiting for stream... (attempt ' + retryCount + '/' + maxRetries + ')';
          statusEl.className = 'status';
          hls.destroy();
          setTimeout(startPlayer, 2000);
        } else {
          statusEl.textContent = 'Stream not available';
          statusEl.className = 'status error';
        }
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', function() { video.play(); });
  }
}

startPlayer();
</script>
</body>
</html>
